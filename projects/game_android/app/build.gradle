plugins
{
    id 'com.android.application'
}

android
{
    namespace 'com.zzz.game'
    compileSdk 35

    defaultConfig
    {
        applicationId "com.zzz.game"

        minSdk 29
        targetSdk 35

        versionCode 1
        versionName "1.0"

        externalNativeBuild
        {
            cmake
            {
                cppFlags "-std=c++23"
            }
        }

        ndk
        {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes
    {
        debug
        {
            debuggable true
        }

        release
        {
            minifyEnabled false
        }
    }

    externalNativeBuild
    {
        cmake
        {
            path "../../../CMakeLists.txt"
            version "4.1.2"
        }
    }

    buildFeatures
    {
        prefab true
    }
}

dependencies
{
}