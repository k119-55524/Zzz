plugins
{
    id 'com.android.application'
}

android
{
    namespace 'com.zzz.game'
    compileSdk 37

    defaultConfig
    {
        applicationId "com.zzz.game"

        minSdk 34
        targetSdk 37

        versionCode 1
        versionName "1.0"

        externalNativeBuild
        {
            cmake
            {
                cppFlags "-std=c++23"
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }

        ndk
        {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes
    {
        debug
        {
            debuggable true
            externalNativeBuild
            {
                cmake
                {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }

        development
        {
            initWith debug
            externalNativeBuild
            {
                cmake
                {
                    arguments "-DCMAKE_BUILD_TYPE=Development"
                }
            }
        }

        developmentAsan
        {
            initWith debug
            externalNativeBuild
            {
                cmake
                {
                    arguments "-DCMAKE_BUILD_TYPE=Development_ASan"
                }
            }
        }

        developmentTsan
        {
            initWith debug
            externalNativeBuild
            {
                cmake
                {
                    // Caveat: ThreadSanitizer support on Android NDK is limited/unstable
                    // depending on NDK version and ABI.
                    arguments "-DCMAKE_BUILD_TYPE=Development_TSan"
                }
            }
        }

        release
        {
            minifyEnabled false
            externalNativeBuild
            {
                cmake
                {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }

    externalNativeBuild
    {
        cmake
        {
            path "../../../../CMakeLists.txt"
            version "4.1.2"
        }
    }

    buildFeatures
    {
        prefab true
    }
}

dependencies
{
    implementation "androidx.games:games-activity:4.4.2"
    implementation "androidx.appcompat:appcompat:1.7.0"
}